name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ci:
    uses: ./.github/workflows/validate-ci.yaml
    with:
      event_name: ${{ github.event_name }}
      base_ref: ${{ github.base_ref }}
      head_ref: ${{ github.head_ref }}

  build:
    needs: validate-ci
    if: always() && (needs.validate-ci.result == 'success' || needs.validate-ci.result == 'skipped')
    name: Build and Test
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
      DO_NOT_TRACK: 1

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check
